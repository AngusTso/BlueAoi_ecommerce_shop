<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Blue Aoi tab icon (generated from src/assets/logo.jpg) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blue Aoi — 100% handmade bracelets & accessories, designed and strung by hand in Hong Kong. Shop one-of-a-kind pieces and order easily via WhatsApp."
    />
    <meta name="theme-color" content="#eff6fd" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blue Aoi" />
    <meta
      property="og:title"
      content="Blue Aoi · Handmade Bracelets & Products"
    />
    <meta
      property="og:description"
      content="100% handmade bracelets, designed and strung by hand in Hong Kong. One-of-a-kind pieces — order via WhatsApp."
    />
    <meta property="og:url" content="https://blueaoi-handmade.netlify.app/" />
    <meta
      property="og:image"
      content="https://blueaoi-handmade.netlify.app/og-image.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Blue Aoi · Handmade Bracelets & Products"
    />
    <meta
      name="twitter:description"
      content="100% handmade bracelets, designed and strung by hand in Hong Kong."
    />
    <meta
      name="twitter:image"
      content="https://blueaoi-handmade.netlify.app/og-image.jpg"
    />
    <link rel="canonical" href="https://blueaoi-handmade.netlify.app/" />

    <!-- Structured data (helps Google understand the shop) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Blue Aoi",
        "description": "100% handmade bracelets & original design accessories, designed and strung by hand in Hong Kong.",
        "image": "https://blueaoi-handmade.netlify.app/og-image.jpg",
        "url": "https://blueaoi-handmade.netlify.app/",
        "sameAs": ["https://www.instagram.com/BlueAoi_HandmadeBracelet"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hong Kong",
          "addressCountry": "HK"
        },
        "currenciesAccepted": "HKD",
        "paymentAccepted": "PayMe, FPS"
      }
    </script>

    <title>Blue Aoi · Handmade Bracelets &amp; Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
